
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I miei file</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        #files {
            max-width: 800px;
            margin: 25px auto;
        }

        .file {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            margin-bottom: 8px;
            background: white;
            border-radius: 8px;
            text-decoration: none;
            color: #222;
            box-shadow: 0 2px 5px #0000000d;
            overflow-wrap: anywhere;
        }

        .file:hover {
            background: #e8f0fe;
        }

        .folder {
            font-weight: bold;
        }

        #status {
            text-align: center;
            color: #666;
        }
    </style>
</head>

<body>

    <h1>📁 I miei file</h1>
    <p id="status">Caricamento dei file...</p>
    <div id="files"></div>

    

<script>
const proprietario = "TommasoFalchero";
const repository = "JavaScript 2026-2027";
const branch = "main";

const contenitore = document.getElementById("files");
const stato = document.getElementById("status");

const baseURL =
    "https://tommasofalchero.github.io/JavaScript-2026-2027/";

async function mostraFile(percorso = "") {
    stato.textContent = "Caricamento dei file...";
    contenitore.replaceChildren();

    const url =
        `https://api.github.com/repos/${proprietario}/${repository}/contents/` +
        `${percorso.split("/").map(encodeURIComponent).join("/")}` +
        `?ref=${branch}`;

    try {
        const risposta = await fetch(url);
        const dati = await risposta.json();

        if (!risposta.ok) {
            throw new Error(
                `HTTP ${risposta.status}: ${dati.message || "Errore API"}`
            );
        }

        if (!Array.isArray(dati)) {
            throw new Error("La risposta GitHub non è un elenco di file.");
        }

        dati.sort((a, b) => {
            if (a.type !== b.type) {
                return a.type === "dir" ? -1 : 1;
            }
            return a.name.localeCompare(b.name);
        });

        for (const elemento of dati) {
            const link = document.createElement("a");
            link.className = "file";

            if (elemento.type === "dir") {
                link.textContent = "📁 " + elemento.name + "/";
                link.href = "#";

                link.onclick = (evento) => {
                    evento.preventDefault();
                    mostraFile(elemento.path);
                };
            } else {
                link.textContent = "📄 " + elemento.name;

                link.href = baseURL +
                    elemento.path.split("/")
                        .map(encodeURIComponent)
                        .join("/");

                link.target = "_blank";
                link.rel = "noopener noreferrer";
            }

            contenitore.appendChild(link);
        }

        stato.textContent = `${dati.length} elementi trovati.`;

    } catch (errore) {
        stato.textContent = "Errore nel caricamento: " + errore.message;
        console.error(errore);
    }
}

mostraFile();
</script>


</body>
</html>
