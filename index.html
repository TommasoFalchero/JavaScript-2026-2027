
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio dei progetti JavaScript 2026-2027">
    <title>I miei progetti | JavaScript 2026-2027</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: #f1f5f9;
            min-height: 100vh;
        }

        header {
            padding: 75px 20px 55px;
            text-align: center;
            background: linear-gradient(135deg, #172554, #312e81, #0f172a);
        }

        .tag {
            display: inline-block;
            color: #a5b4fc;
            border: 1px solid #6366f1;
            border-radius: 30px;
            padding: 7px 16px;
            font-size: 12px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        header h1 {
            font-size: clamp(32px, 6vw, 55px);
            margin-bottom: 15px;
        }

        header h1 span {
            color: #818cf8;
        }

        header p {
            color: #cbd5e1;
            font-size: 16px;
        }

        main {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 22px;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .section-title h2 {
            font-size: 25px;
        }

        #counter {
            color: #a5b4fc;
            font-size: 14px;
        }

        .search {
            width: 100%;
            padding: 15px 18px;
            border: 1px solid #334155;
            border-radius: 12px;
            background: #172033;
            color: white;
            font-size: 15px;
            outline: none;
            margin-bottom: 28px;
        }

        .search:focus {
            border-color: #818cf8;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 22px;
        }

        .card {
            background: #151f32;
            border: 1px solid #263449;
            border-radius: 16px;
            padding: 25px;
            transition: .25s;
            display: flex;
            flex-direction: column;
            min-height: 210px;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: #818cf8;
            box-shadow: 0 12px 35px #0005;
        }

        .icon {
            font-size: 30px;
            margin-bottom: 18px;
        }

        .card h3 {
            font-size: 19px;
            margin-bottom: 10px;
        }

        .card p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 22px;
            flex-grow: 1;
        }

        .card a {
            display: inline-block;
            text-decoration: none;
            color: #a5b4fc;
            font-weight: bold;
            font-size: 14px;
        }

        .card a:hover {
            color: white;
        }

        .status {
            text-align: center;
            color: #94a3b8;
            padding: 40px 10px;
            grid-column: 1 / -1;
        }

        footer {
            border-top: 1px solid #263449;
            text-align: center;
            padding: 30px 15px;
            color: #64748b;
            font-size: 13px;
            margin-top: 70px;
        }

        footer a {
            color: #818cf8;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <div class="tag">PORTFOLIO SCOLASTICO · 2026/2027</div>

        <h1>I miei progetti <span>JavaScript</span></h1>

        <p>Una raccolta dei miei esercizi e progetti di programmazione.</p>
    </header>

    <main>

        <div class="section-title">
            <h2>Esplora i progetti</h2>
            <span id="counter">Caricamento...</span>
        </div>

        <input
            type="search"
            class="search"
            id="search"
            placeholder="🔍 Cerca un progetto..."
            aria-label="Cerca un progetto"
        >

        <div class="grid" id="projects">
            <div class="status">Caricamento dei progetti...</div>
        </div>

    </main>

    <footer>
        <p>
            Realizzato con JavaScript · 2026/2027
        </p>
        <p style="margin-top:10px">
            <a href="https://github.com/TommasoFalchero/JavaScript-2026-2027"
               target="_blank">
                Visualizza repository su GitHub ↗
            </a>
        </p>
    </footer>

    <script>
        const USER = "TommasoFalchero";
        const REPO = "JavaScript-2026-2027";

        const API = `https://api.github.com/repos/${USER}/${REPO}/contents`;

        const container = document.getElementById("projects");
        const counter = document.getElementById("counter");
        const search = document.getElementById("search");

        const icons = ["💻", "⚡", "🔢", "🌐", "📚", "🚀"];

        let allProjects = [];

        function createCard(project, index) {
            const card = document.createElement("article");
            card.className = "card";

            const icon = document.createElement("div");
            icon.className = "icon";
            icon.textContent = icons[index % icons.length];

            const title = document.createElement("h3");
            title.textContent = project.name;

            const description = document.createElement("p");
            description.textContent = "Progetto JavaScript della raccolta 2026/2027.";

            const link = document.createElement("a");
            link.href = project.url;
            link.textContent = "Apri progetto →";
            link.target = "_blank";
            link.rel = "noopener noreferrer";

            card.append(icon, title, description, link);

            return card;
        }

        function renderProjects(projects) {
            container.replaceChildren();

            counter.textContent = `${projects.length} progetti`;

            if (projects.length === 0) {
                const message = document.createElement("div");
                message.className = "status";
                message.textContent = "Nessun progetto trovato.";
                container.appendChild(message);
                return;
            }

            projects.forEach((project, index) => {
                container.appendChild(createCard(project, index));
            });
        }

        async function loadProjects() {
            try {
                const response = await fetch(API);

                if (!response.ok) {
                    throw new Error("Errore nel caricamento della repository");
                }

                const files = await response.json();

                const folders = files.filter(item =>
                    item.type === "dir" &&
                    !item.name.startsWith(".")
                );

                const results = await Promise.all(
                    folders.map(async folder => {
                        try {
                            const res = await fetch(folder.url);

                            if (!res.ok) return null;

                            const contents = await res.json();

                            const htmlFile = contents.find(file =>
                                file.type === "file" &&
                                file.name.toLowerCase() === "index.html"
                            ) || contents.find(file =>
                                file.type === "file" &&
                                file.name.toLowerCase().endsWith(".html")
                            );

                            const url = htmlFile
                                ? `./${encodeURIComponent(folder.name)}/${encodeURIComponent(htmlFile.name)}`
                                : folder.html_url;

                            return {
                                name: folder.name,
                                url: url
                            };

                        } catch {
                            return null;
                        }
                    })
                );

                allProjects = results
                    .filter(Boolean)
                    .sort((a, b) => a.name.localeCompare(b.name, "it"));

                renderProjects(allProjects);

            } catch (error) {
                console.error(error);

                container.innerHTML = `
                    <div class="status">
                        Impossibile caricare i progetti.<br><br>
                        Controlla la connessione e riprova.
                        <br><br>
                        <button onclick="loadProjects()">
                            Riprova
                        </button>
                    </div>
                `;

                counter.textContent = "Errore";
            }
        }

        search.addEventListener("input", () => {
            const query = search.value.toLowerCase();

            const filtered = allProjects.filter(project =>
                project.name.toLowerCase().includes(query)
            );

            renderProjects(filtered);
        });

        loadProjects();
    </script>

</body>
</html>
