
<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Raccolta di esercizi e progetti JavaScript 2026-2027.">

    <title>JavaScript 2026–2027</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff;
            color: #333;
            line-height: 1.5;
        }

        header {
            padding: 35px 20px;
            background: #f5f5f5;
            border-bottom: 1px solid #e5e5e5;
        }

        .header-content {
            max-width: 700px;
            margin: auto;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 6px 0 0;
            color: #666;
            font-size: 15px;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            min-height: 55vh;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .intro {
            margin-bottom: 22px;
            color: #666;
            font-size: 14px;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            border-top: 1px solid #e5e5e5;
        }

        .file {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 17px 12px;
            border-bottom: 1px solid #e5e5e5;
            color: #333;
            text-decoration: none;
            border-radius: 5px;
            transition: background .2s, padding .2s, color .2s;
        }

        .file:hover {
            background: #f6f8fa;
            color: #0969da;
            padding-left: 17px;
        }

        .file:focus-visible {
            outline: 2px solid #0969da;
            outline-offset: 3px;
        }

        .file strong {
            display: block;
            font-size: 15px;
        }

        .file span {
            display: block;
            margin-top: 4px;
            color: #777;
            font-size: 13px;
        }

        .arrow {
            flex-shrink: 0;
            font-size: 25px;
            color: #999;
        }

        .status {
            color: #777;
            font-size: 14px;
            padding: 18px 0;
        }

        footer {
            padding: 25px 20px;
            border-top: 1px solid #e5e5e5;
            text-align: center;
            font-size: 13px;
            color: #777;
        }

        footer a {
            color: #0969da;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            header {
                padding: 28px 20px;
            }

            header h1 {
                font-size: 24px;
            }

            main {
                margin: 30px auto;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-content">
            <h1>JavaScript 2026–2027</h1>
            <p>Raccolta di esercizi e progetti</p>
        </div>
    </header>

    <main>

        <h2>Elenco dei progetti</h2>

        <p class="intro">
            Seleziona un progetto per aprirlo.
        </p>

        <nav class="file-list"
             id="fileList"
             aria-label="Elenco dei progetti">

            <p class="status">Caricamento dei progetti...</p>

        </nav>

    </main>

    <footer>

        <a href="https://github.com/TommasoFalchero/JavaScript-2026-2027"
           target="_blank"
           rel="noopener noreferrer">
            Repository su GitHub ↗
        </a>

        <p>Progetti JavaScript · Anno scolastico 2026–2027</p>

    </footer>

    <script>

        const fileList = document.getElementById("fileList");

        async function caricaProgetti() {

            try {

                const response = await fetch("./files.json?t=" + Date.now());

                if (!response.ok) {
                    throw new Error("Errore nel caricamento.");
                }

                const projects = await response.json();

                fileList.replaceChildren();

                if (projects.length === 0) {

                    const message = document.createElement("p");
                    message.className = "status";
                    message.textContent = "Nessun progetto disponibile.";

                    fileList.appendChild(message);
                    return;
                }

                projects.forEach(project => {

                    const link = document.createElement("a");

                    link.className = "file";
                    link.href = project.url;

                    const content = document.createElement("div");

                    const title = document.createElement("strong");
                    title.textContent = project.title;

                    const description = document.createElement("span");
                    description.textContent = "Progetto JavaScript";

                    const arrow = document.createElement("span");
                    arrow.className = "arrow";
                    arrow.textContent = "›";
                    arrow.setAttribute("aria-hidden", "true");

                    content.appendChild(title);
                    content.appendChild(description);

                    link.appendChild(content);
                    link.appendChild(arrow);

                    fileList.appendChild(link);

                });

            } catch (error) {

                fileList.replaceChildren();

                const message = document.createElement("p");
                message.className = "status";
                message.textContent =
                    "Impossibile caricare i progetti. Riprova più tardi.";

                fileList.appendChild(message);

                console.error(error);

            }

        }

        caricaProgetti();

    </script>

</body>
</html>
