
<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Raccolta di esercizi e progetti JavaScript 2026-2027.">

    <meta name="theme-color" content="#f5f5f5">

    <title>JavaScript 2026–2027</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff;
            color: #333;
            line-height: 1.5;
        }

        header {
            padding: 35px 20px;
            background: #f5f5f5;
            border-bottom: 1px solid #e5e5e5;
        }

        .header-content {
            max-width: 700px;
            margin: auto;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: -0.5px;
        }

        header p {
            margin: 6px 0 0;
            color: #666;
            font-size: 15px;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            min-height: 55vh;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .intro {
            margin-top: 0;
            margin-bottom: 22px;
            color: #666;
            font-size: 14px;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            border-top: 1px solid #e5e5e5;
        }

        .file {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 17px 12px;
            border-bottom: 1px solid #e5e5e5;
            color: #333;
            text-decoration: none;
            border-radius: 5px;
            transition: background .2s, padding .2s, color .2s;
        }

        .file:hover {
            background: #f6f8fa;
            color: #0969da;
            padding-left: 17px;
        }

        .file:focus-visible {
            outline: 2px solid #0969da;
            outline-offset: 3px;
        }

        .file strong {
            display: block;
            font-size: 15px;
            font-weight: 600;
        }

        .file span {
            display: block;
            margin-top: 4px;
            color: #777;
            font-size: 13px;
        }

        .arrow {
            flex-shrink: 0;
            margin: 0 !important;
            color: #999;
            font-size: 25px !important;
            transition: transform .2s, color .2s;
        }

        .file:hover .arrow {
            color: #0969da;
            transform: translateX(4px);
        }

        .status {
            color: #777;
            font-size: 14px;
            padding: 18px 0;
        }

        .retry {
            display: inline-block;
            margin-top: 10px;
            padding: 9px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #fff;
            color: #333;
            cursor: pointer;
            font-size: 13px;
        }

        .retry:hover {
            background: #f6f8fa;
        }

        footer {
            padding: 25px 20px;
            border-top: 1px solid #e5e5e5;
            text-align: center;
            font-size: 13px;
            color: #777;
        }

        footer a {
            color: #0969da;
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            text-decoration: underline;
        }

        footer p {
            margin: 8px 0 0;
        }

        @media (max-width: 480px) {
            header {
                padding: 28px 20px;
            }

            header h1 {
                font-size: 24px;
            }

            main {
                margin: 30px auto;
            }

            .file {
                padding: 15px 8px;
            }

            .file strong {
                font-size: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-content">
            <h1>JavaScript 2026–2027</h1>
            <p>Raccolta di esercizi e progetti</p>
        </div>
    </header>

    <main>

        <h2>Elenco dei progetti</h2>

        <p class="intro">
            Seleziona un progetto per aprirlo.
        </p>

        <nav
            class="file-list"
            id="fileList"
            aria-label="Elenco dei progetti"
            aria-live="polite"
        >
            <p class="status">Caricamento dei progetti...</p>
        </nav>

    </main>

    <footer>

        <a
            href="https://github.com/TommasoFalchero/JavaScript-2026-2027"
            target="_blank"
            rel="noopener noreferrer"
        >
            Repository su GitHub ↗
        </a>

        <p>Progetti JavaScript · Anno scolastico 2026–2027</p>

    </footer>

    <script>

        const fileList = document.getElementById("fileList");

        /**
         * Crea un elemento HTML in sicurezza.
         */
        function creaElemento(tag, className, text) {

            const element = document.createElement(tag);

            if (className) {
                element.className = className;
            }

            if (text !== undefined) {
                element.textContent = text;
            }

            return element;
        }

        /**
         * Mostra un messaggio di stato.
         */
        function mostraErrore() {

            fileList.replaceChildren();

            const message = creaElemento(
                "p",
                "status",
                "Impossibile caricare i progetti."
            );

            const retry = creaElemento(
                "button",
                "retry",
                "Riprova"
            );

            retry.type = "button";

            retry.addEventListener("click", caricaProgetti);

            fileList.append(message, retry);
        }

        /**
         * Genera una voce per ciascun progetto.
         */
        function creaProgetto(project) {

            const link = document.createElement("a");

            link.className = "file";
            link.href = project.url;

            const content = document.createElement("div");

            const title = creaElemento(
                "strong",
                "",
                project.title
            );

            const description = creaElemento(
                "span",
                "",
                "Progetto JavaScript"
            );

            const arrow = creaElemento(
                "span",
                "arrow",
                "›"
            );

            arrow.setAttribute("aria-hidden", "true");

            content.append(title, description);

            link.append(content, arrow);

            return link;
        }

        /**
         * Carica automaticamente tutti i progetti.
         */
        async function caricaProgetti() {

            fileList.replaceChildren();

            fileList.appendChild(
                creaElemento(
                    "p",
                    "status",
                    "Caricamento dei progetti..."
                )
            );

            try {

                const response = await fetch(
                    "./files.json?t=" + Date.now(),
                    { cache: "no-store" }
                );

                if (!response.ok) {
                    throw new Error("File files.json non trovato.");
                }

                const projects = await response.json();

                if (!Array.isArray(projects)) {
                    throw new Error("Formato JSON non valido.");
                }

                const validProjects = projects.filter(project => {

                    return (
                        project &&
                        typeof project.title === "string" &&
                        typeof project.url === "string" &&
                        project.title.trim() !== "" &&
                        project.url.trim() !== "" &&
                        !project.url.startsWith("/") &&
                        !project.url.includes("\\") &&
                        !/^(?:[a-z]+:|\/\/)/i.test(project.url) &&
                        !project.url.split("/").some(
                            part => part === ".."
                        )
                    );

                });

                validProjects.sort((a, b) =>
                    a.title.localeCompare(b.title, "it", {
                        sensitivity: "base"
                    })
                );

                fileList.replaceChildren();

                if (validProjects.length === 0) {

                    fileList.appendChild(
                        creaElemento(
                            "p",
                            "status",
                            "Nessun progetto disponibile."
                        )
                    );

                    return;
                }

                const fragment = document.createDocumentFragment();

                validProjects.forEach(project => {
                    fragment.appendChild(creaProgetto(project));
                });

                fileList.appendChild(fragment);

            } catch (error) {

                console.error(
                    "Errore durante il caricamento:",
                    error
                );

                mostraErrore();

            }

        }

        // Avvio automatico.
        caricaProgetti();

    </script>

</body>
</html>
