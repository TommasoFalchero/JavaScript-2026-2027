```html
<!DOCTYPE html>
<html>
<body>

<!-- Titolo principale della pagina -->
<h1>INSERIRE I DATI:</h1>

<!-- Etichetta che indica all'utente di inserire il nome -->
<!-- Il valore di "for" è collegato all'input tramite il suo id -->
<label for="fname">Nome:</label><br>

<!-- Casella di testo in cui l'utente scrive il nome -->
<input type="text" id="fname" name="fname"><br>

<!-- Etichetta e casella di testo per inserire il cognome -->
<label for="lname">Cognome:</label><br>
<input type="text" id="lname" name="lname"><br><br>

<!-- Pulsante che richiama la funzione JavaScript RisultatoColorati()
     quando viene cliccato -->
<input type="button" value="Avanti" onclick="RisultatoColorati()"> 
<br><br>

<!-- Spiega all'utente che deve inserire il nome del colore in inglese -->
<label for="colore">
    Colore (inserisci il nome in inglese del colore desiderato, no maiuscola iniziale):
</label>
<br><br>

<!-- Casella di testo in cui inserire il colore desiderato -->
<input type="text" id="colore" colore="colore"><br><br>

<!-- Paragrafo che potrebbe essere usato per mostrare un risultato -->
<p id="risultato"></p>

<!-- Crea una tabella con un bordo di spessore 1 -->
<table border="1">

    <!-- Prima riga: contiene le intestazioni delle colonne -->
    <tr>
        <th>Nome</th>
        <th>Cognome</th>
    </tr>

    <!-- Seconda riga: contiene le celle in cui inserire i dati -->
    <tr>
        <!-- Questa cella mostrerà il nome inserito dall'utente -->
        <td id="nomeTabella"></td>

        <!-- Questa cella mostrerà il cognome inserito dall'utente -->
        <td id="cognomeTabella"></td>
    </tr>

</table>

<script>

// Definisce una funzione chiamata RisultatoColorati
// Questa funzione viene eseguita quando si clicca sul pulsante "Avanti"
function RisultatoColorati() {

    // Cerca nella pagina l'elemento con id "fname"
    // .value permette di leggere il testo scritto nella casella
    // Il valore viene salvato nella variabile nome
    let nome = document.getElementById("fname").value;

    // Legge il cognome inserito dall'utente
    // e lo salva nella variabile cognome
    let cognome = document.getElementById("lname").value;

    // Legge il colore inserito dall'utente
    // e lo salva nella variabile colore
    let colore = document.getElementById("colore").value;


    // Cerca la cella della tabella con id "nomeTabella"
    // .innerHTML inserisce al suo interno il nome scritto dall'utente
    document.getElementById("nomeTabella").innerHTML = nome;

    // Inserisce il cognome nella cella corrispondente della tabella
    document.getElementById("cognomeTabella").innerHTML = cognome;


    // Modifica il colore del testo nella cella del nome
    // .style.color permette di cambiare il colore del testo
    // Il colore utilizzato è quello inserito dall'utente
    document.getElementById("nomeTabella").style.color = colore;

    // Applica lo stesso colore al testo del cognome
    document.getElementById("cognomeTabella").style.color = colore;

}

</script>

</body>
</html>
```
