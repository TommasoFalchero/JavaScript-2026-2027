<!DOCTYPE html>
<html>
<body>

<h1>INSERIRE I DATI:</h1>

<label for="fname"> Nome: </label><br>
<input type="text" id="fname" name="fname"> <br>

<label for="lname">Cognome:</label> <br>
<input type="text" id="lname" name="lname"> <br>    <br>

<input type="button" value="Avanti" onclick="RisultatoColorati()">

<p id="risultato">  </p>

<script>

function RisultatoColorati() {

    let nome = document.getElementById("fname").value;
    let cognome = document.getElementById("lname").value;

    document.getElementById("risultato").innerHTML =
        nome + " " + cognome;

    document.getElementById("risultato").style.color = "blue";
}

</script>

</body>
</html>
