
<!DOCTYPE html>
<html>

<head>
    <title>Programma dei dati anagrafici</title>
</head>

<body>

    <h1>Dati Anagrafici</h1>

    <p>
        Compila il modulo inserendo le tue informazioni personali
    </p>

    <form id="modulo">

        <h2>Informazioni personali</h2>

        <div>
            <label>NOME:</label>
            <input type="text" name="nome">
        </div>

        <div>
            <label>COGNOME:</label>
            <input type="text" name="cognome">
        </div>

        <div>
            <label>ETÀ:</label>
            <input type="number" name="eta">
        </div>

        <div>
            <label>SESSO:</label>

            <label>
                <input type="radio" name="sesso" value="Maschio">
                Maschio
            </label>

            <label>
                <input type="radio" name="sesso" value="Femmina">
                Femmina
            </label>

            <label>
                <input type="radio" name="sesso" value="Altro">
                Altro
            </label>
        </div>

        <h2>Residenza</h2>

        <div>
            <label>INDIRIZZO:</label>
            <input type="text" name="indirizzo">
        </div>

        <div>
            <label>CITTÀ:</label>
            <input type="text" name="citta">
        </div>

        <div>
            <label>PROVINCIA:</label>

            <select name="provincia">
                <option value="MI">Milano</option>
                <option value="RM">Roma</option>
                <option value="TO">Torino</option>
                <option value="NA">Napoli</option>
                <option value="FI">Firenze</option>
            </select>
        </div>

        <h2>Sport praticati</h2>

        <div>
            <label><input type="checkbox" name="sport" value="Calcio"> Calcio</label>
            <label><input type="checkbox" name="sport" value="Nuoto"> Nuoto</label>
            <label><input type="checkbox" name="sport" value="Pallavolo"> Pallavolo</label>
            <label><input type="checkbox" name="sport" value="Tennis"> Tennis</label>
            <label><input type="checkbox" name="sport" value="Boxe"> Boxe</label>
            <label><input type="checkbox" name="sport" value="Pallanuoto"> Pallanuoto</label>
            <label><input type="checkbox" name="sport" value="Basket"> Basket</label>
            <label><input type="checkbox" name="sport" value="Atletica"> Atletica</label>
            <label><input type="checkbox" name="sport" value="Equitazione"> Equitazione</label>
            <label><input type="checkbox" name="sport" value="Sci"> Sci</label>
            <label><input type="checkbox" name="sport" value="Pattinaggio"> Pattinaggio</label>
            <label><input type="checkbox" name="sport" value="Ciclismo"> Ciclismo</label>
            <label><input type="checkbox" name="sport" value="Non pratico Sport"> Non pratico Sport</label>
        </div>

        <h2>Commenti</h2>

        <div>
            <textarea name="commenti" rows="5"
                placeholder="Scrivi qui eventuali commenti..."></textarea>
        </div>

        <div>
            <button type="submit">Invia dati</button>
            <button type="reset">Cancella</button>
        </div>

    </form>

    <h2>Dati inseriti</h2>

    <table id="tabella" border="1">

        <tr>
            <th>Dato</th>
            <th>Valore</th>
        </tr>

    </table>

    <script>

        document.getElementById("modulo").onsubmit = function(event) {

            event.preventDefault();

            let nome = document.getElementsByName("nome")[0].value;
            let cognome = document.getElementsByName("cognome")[0].value;
            let eta = document.getElementsByName("eta")[0].value;

            if (eta < 0) {
                alert("Età non valida! Inserisci un'età maggiore o uguale a 0.");
                return;
            }

            let sesso = document.querySelector('input[name="sesso"]:checked');

            if (sesso == null) {
                sesso = "Non selezionato";
            } else {
                sesso = sesso.value;
            }

            let indirizzo = document.getElementsByName("indirizzo")[0].value;
            let citta = document.getElementsByName("citta")[0].value;

            let provincia = document.getElementsByName("provincia")[0];
            provincia = provincia.options[provincia.selectedIndex].text;

            let sportSelezionati = document.querySelectorAll('input[name="sport"]:checked');

            let sport = "";

            sportSelezionati.forEach(function(elemento) {
                sport = sport + elemento.value + " ";
            });

            let commenti = document.getElementsByName("commenti")[0].value;

            let tabella = document.getElementById("tabella");

            tabella.innerHTML = "<tr><th>Dato</th><th>Valore</th></tr>";

            function aggiungiRiga(dato, valore) {

                let riga = tabella.insertRow();

                let cella1 = riga.insertCell();
                let cella2 = riga.insertCell();

                cella1.textContent = dato;
                cella2.textContent = valore;

            }

            aggiungiRiga("Nome", nome);
            aggiungiRiga("Cognome", cognome);
            aggiungiRiga("Età", eta);
            aggiungiRiga("Sesso", sesso);
            aggiungiRiga("Indirizzo", indirizzo);
            aggiungiRiga("Città", citta);
            aggiungiRiga("Provincia", provincia);
            aggiungiRiga("Sport praticati", sport);
            aggiungiRiga("Commenti", commenti);

        };

    </script>

</body>

</html>
